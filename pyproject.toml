[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tool-rag"
version = "0.0.1"
description = "RAG for AI tools: permission-aware tool retrieval for MCP. Each agent gets only the relevant tools its user may use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Rafae Gill" }]
dependencies = ["mcp-gatekeeper @ git+https://github.com/rafae-gill/mcp-gatekeeper"]

[project.optional-dependencies]
embeddings = ["fastembed>=0.4", "numpy"]
dev = ["pytest>=8", "fastembed>=0.4", "numpy"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mcp_tool_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
