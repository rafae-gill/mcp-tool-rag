name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    name: py${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      # The keyword-only evaluation needs no model download, so CI checks that
      # the published synthetic numbers still reproduce.
      - run: python eval/run_eval.py --retrievers bm25 --out /tmp/ci_results
